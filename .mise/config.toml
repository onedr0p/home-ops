[tool_alias]
actionlint = "github:rhysd/actionlint"
jq = "github:jqlang/jq"
just = "github:casey/just"
lefthook = "github:evilmartians/lefthook"
minijinja = "github:mitsuhiko/minijinja"
oxfmt = "npm:oxfmt"
shellcheck = "github:koalaman/shellcheck"
zizmor = "github:zizmorcore/zizmor"

[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
"1password-cli" = "2.35.0"
actionlint = "1.7.12"
jq = "1.8.2"
just = "1.57.0"
lefthook = "2.1.10"
minijinja = "2.21.0"
node = "26.5.0"
oxfmt = "0.60.0"
shellcheck = "0.11.0"
talos = "1.14.0-beta.0"
zizmor = "1.28.0"
