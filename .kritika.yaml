---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
rules:
  - id: renovate
    when: [{ expr: pr.headRef.startsWith("renovate/") }]
    rule: >-
      This is a Renovate dependency update. Read the review-renovate-pr skill
      and follow it. Start the summary with a verdict, safe to merge or not,
      and name the sources you read.
skills:
  scope:
    review-renovate-pr:
      when: [{ expr: pr.headRef.startsWith("renovate/") }]
