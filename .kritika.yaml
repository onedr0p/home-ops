---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
rules:
  - id: renovate
    whenExpr: pr.headRef.startsWith("renovate/")
    rule: >-
      This is a Renovate dependency update. Find what changed between the old
      and new versions from upstream's release notes, changelog or compare
      view, fetching them with gh when the body does not include them. Then
      check how this repository uses the package (its HelmRelease values,
      OCIRepository, overrides and CRDs) and report each breaking change,
      deprecation, removed or renamed value, or changed default that affects
      it. Start the summary with a verdict, safe to merge or not, and name
      the sources you read.
