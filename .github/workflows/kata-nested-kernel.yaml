---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Kata Nested Kernel

on:
  push:
    branches:
      - main
    paths:
      - docker/kata-nested-kernel/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Kata Nested Kernel - Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Kata Version
        id: kata
        run: |
          version="$(grep -oP '^ARG KATA_VERSION=\K.*' docker/kata-nested-kernel/Dockerfile)"
          [[ -n "${version}" ]] || { echo "could not read KATA_VERSION"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/kata-nested-kernel
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/kata-nested-kernel:kata${{ steps.kata.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kata-nested-kernel:kata${{ steps.kata.outputs.version }}-${{ github.sha }}
