---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Talos Validate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Talos Validate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: talos/**/*

  validate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Talos Validate - Render & Validate
    runs-on: ubuntu-latest
    env:
      JUST_UNSTABLE: "1"
      MINIJINJA_CONFIG_FILE: ${{ github.workspace }}/.minijinja.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
          tool_versions: |
            aqua:mitsuhiko/minijinja latest
            jq latest
            just latest

      # Stand-in for `op inject` so this job needs no 1Password access and
      # renders contain no real secrets: each op:// reference becomes a unique
      # 32-byte placeholder, which satisfies talosctl validate.
      - name: Stub op inject
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          cat > "${RUNNER_TEMP}/bin/op" <<'EOF'
          #!/usr/bin/env python3
          import base64, hashlib, re, sys
          sys.stdout.write(re.sub(
              r"op://\S+",
              lambda m: base64.b64encode(hashlib.sha256(m.group(0).encode()).digest()).decode(),
              sys.stdin.read(),
          ))
          EOF
          chmod +x "${RUNNER_TEMP}/bin/op"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Render & Validate
        run: |
          for file in talos/nodes/*/*.yaml.j2; do
              [[ -f "${file}" ]] || continue
              [[ "${file}" == *.schematic.yaml.j2 ]] && continue
              node="$(basename "${file}" .yaml.j2)"
              echo "Validating ${node}"
              just talos render-config "${node}" > /tmp/machineconfig.yaml
              talosctl validate --strict -m metal -c /tmp/machineconfig.yaml
              rm /tmp/machineconfig.yaml
          done

  success:
    if: ${{ !cancelled() }}
    needs: validate
    name: Talos Validate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
