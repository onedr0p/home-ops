---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Talos Validate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Talos Validate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
      nodes: ${{ steps.nodes.outputs.nodes }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: talos/**/*

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: talos

      - name: Get Nodes
        id: nodes
        run: |
          echo "nodes=$(basename -a -s .yaml.j2 talos/nodes/*/*.yaml.j2 | grep -v '\.schematic$' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  # Renders the node with real secrets on the in-cluster runner, checks it
  # with talosctl validate, and reports a dry-run summary against the live
  # node. Same-repo PRs only, so fork PRs can neither reach the vault token
  # nor queue jobs on the self-hosted runner. Config changes in the dry-run
  # are neutral; only render, validate, or apply errors fail.
  validate:
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Talos Validate - Validate
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        node: ${{ fromJSON(needs.filter.outputs.nodes) }}
      fail-fast: false
    env:
      JUST_UNSTABLE: "1"
      MINIJINJA_CONFIG_FILE: ${{ github.workspace }}/.minijinja.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false

      # Render, validate, and apply output is suppressed so secret material
      # never reaches the logs of this public repo; validation errors can
      # quote field values
      - name: Validate & Dry Run
        env:
          NODE: ${{ matrix.node }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          just talos render-config "${NODE}" > "${RUNNER_TEMP}/machineconfig.yaml" 2>/dev/null
          talosctl validate --strict -m metal -c "${RUNNER_TEMP}/machineconfig.yaml" > /dev/null 2>&1
          output="$(talosctl -n "${NODE}" apply-config -f "${RUNNER_TEMP}/machineconfig.yaml" --dry-run 2>&1)"
          if grep -q "No changes" <<< "${output}"; then
              echo "${NODE}: valid, no changes" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
              kinds="$(grep -oP '^[+-]\s*kind: \K\S+' <<< "${output}" | sort -u | paste -sd ', ' - || true)"
              echo "${NODE}: valid, changes detected${kinds:+ (${kinds})}" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

  success:
    if: ${{ !cancelled() }}
    needs: validate
    name: Talos Validate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
