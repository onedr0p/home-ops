---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Talos Validate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Talos Validate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
      nodes: ${{ steps.nodes.outputs.nodes }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: talos/**/*

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: talos

      # A node is whatever declares a HostnameConfig; schematic overrides
      # exclude themselves by not containing one
      - name: Get Nodes
        id: nodes
        run: echo "nodes=$(yq ea -o json -I0 '[.] | map(select(.kind == "HostnameConfig").hostname)' talos/nodes/*/*.yaml.j2)" >> "$GITHUB_OUTPUT"

  # Renders the node against a generated Talos secrets bundle and checks it
  # with talosctl validate. The job touches no real secrets, so it needs no
  # 1Password access, no self-hosted runner, and no output suppression.
  validate:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Talos Validate - Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(needs.filter.outputs.nodes) }}
      fail-fast: false
    env:
      JUST_UNSTABLE: "1"
      MINIJINJA_CONFIG_FILE: ${{ github.workspace }}/.minijinja.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false

      # .github/scripts/op-stub.sh resolves op:// references from a generated
      # Talos secrets bundle so the render needs no 1Password access
      - name: Stub op inject
        run: |
          talosctl gen secrets -o "${RUNNER_TEMP}/secrets.yaml"
          install -Dm755 .github/scripts/op-stub.sh "${RUNNER_TEMP}/bin/op"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          echo "SECRETS_FILE=${RUNNER_TEMP}/secrets.yaml" >> "$GITHUB_ENV"

      - name: Render & Validate
        env:
          NODE: ${{ matrix.node }}
        run: just talos render-config "${NODE}" | talosctl validate --strict -m metal -c /dev/stdin

  success:
    if: ${{ !cancelled() }}
    needs: validate
    name: Talos Validate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
