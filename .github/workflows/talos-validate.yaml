---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Talos Validate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Talos Validate - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: talos/**/*

  # Renders each node with real secrets on the in-cluster runner, checks it
  # with talosctl validate, and reports a per-node dry-run summary against the
  # live nodes. Same-repo PRs only, so fork PRs can neither reach the vault
  # token nor queue jobs on the self-hosted runner. Config changes in the
  # dry-run are neutral; only render, validate, or apply errors fail.
  validate:
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Talos Validate - Validate
    runs-on: ${{ github.event.repository.name }}-runner
    env:
      JUST_UNSTABLE: "1"
      MINIJINJA_CONFIG_FILE: ${{ github.workspace }}/.minijinja.toml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
          tool_versions: |
            1password-cli latest
            aqua:mitsuhiko/minijinja latest
            jq latest
            just latest

      - name: Validate & Dry Run
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          echo "## Talos Dry Run" >> "${GITHUB_STEP_SUMMARY}"
          failed=0
          for file in talos/nodes/*/*.yaml.j2; do
              [[ -f "${file}" ]] || continue
              [[ "${file}" == *.schematic.yaml.j2 ]] && continue
              node="$(basename "${file}" .yaml.j2)"
              # Render, validate, and apply output is suppressed so secret
              # material never reaches the logs of this public repo; validation
              # errors can quote field values
              if ! just talos render-config "${node}" > /tmp/machineconfig.yaml 2>/dev/null; then
                  echo "${node}: render failed" | tee -a "${GITHUB_STEP_SUMMARY}"
                  failed=1
                  continue
              fi
              if ! talosctl validate --strict -m metal -c /tmp/machineconfig.yaml > /dev/null 2>&1; then
                  echo "${node}: validate failed" | tee -a "${GITHUB_STEP_SUMMARY}"
                  failed=1
                  continue
              fi
              if ! output="$(talosctl -n "${node}" apply-config -f /tmp/machineconfig.yaml --dry-run 2>&1)"; then
                  echo "${node}: apply-config dry-run failed" | tee -a "${GITHUB_STEP_SUMMARY}"
                  failed=1
                  continue
              fi
              rm -f /tmp/machineconfig.yaml
              if grep -q "No changes" <<< "${output}"; then
                  echo "${node}: valid, no changes" | tee -a "${GITHUB_STEP_SUMMARY}"
              else
                  kinds="$(grep -oP '^[+-]\s*kind: \K\S+' <<< "${output}" | sort -u | paste -sd ', ' - || true)"
                  echo "${node}: valid, changes detected${kinds:+ (${kinds})}" | tee -a "${GITHUB_STEP_SUMMARY}"
              fi
          done
          rm -f /tmp/machineconfig.yaml
          exit "${failed}"

  success:
    if: ${{ !cancelled() }}
    needs: validate
    name: Talos Validate - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
