---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Include from a namespace's parent kustomization (which sets `namespace:`) to
# give kopiur mover Jobs in that namespace the repository credential Secret —
# the ESO replacement for the operator's credentialProjection. One include per
# namespace; NOT for the per-app kopiur component (fixed Secret name would
# collide when multiple apps share a namespace).
resources:
  - ./externalsecret.yaml
