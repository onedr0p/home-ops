---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-qemu
# QEMU handler from the siderolabs/kata-containers extension; exposes nested
# virtualization (-cpu host) so org runners can boot QEMU VMs without host priv.
# Requires the updated kata-containers sysext shipping in Talos v1.14.
handler: kata-qemu
