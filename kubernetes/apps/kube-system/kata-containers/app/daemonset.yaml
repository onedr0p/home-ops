---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/daemonset_v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-nested-kernel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-nested-kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-nested-kernel
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: install
          image: docker.io/library/busybox:1.37.0
          command: ["/bin/sh", "-euc"]
          args:
            - |
              cp /artifacts/vmlinux-nested /host/vmlinux-nested.tmp
              mv /host/vmlinux-nested.tmp /host/vmlinux-nested
              cp /artifacts/configuration-qemu.toml /host/configuration-qemu.toml.tmp
              mv /host/configuration-qemu.toml.tmp /host/configuration-qemu.toml
              exec sleep infinity
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_OVERRIDE"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
              readOnly: true
            - name: host
              mountPath: /host
      volumes:
        - name: artifacts
          image:
            reference: ghcr.io/home-operations/kata-nested-kernel:3.32.0
            pullPolicy: IfNotPresent
        - name: host
          hostPath:
            path: /var/lib/kata-nested
            type: DirectoryOrCreate
