---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kata-guest-kernel
spec:
  chartRef:
    kind: OCIRepository
    name: kata-guest-kernel
  interval: 1h
  values:
    controllers:
      kata-guest-kernel:
        type: daemonset
        initContainers:
          install:
            image:
              repository: ghcr.io/home-operations/kata-guest-kernel
              tag: 3.32.0@sha256:71ec1e834cef1ee405230b052f893544353a78d2894e1d8d3302e6bf081e8955
        containers:
          # Same image as the init container, so it costs no extra pull and its
          # shell can assert the artifacts are still staged on the node
          idle:
            image:
              repository: ghcr.io/home-operations/kata-guest-kernel
              tag: 3.32.0@sha256:71ec1e834cef1ee405230b052f893544353a78d2894e1d8d3302e6bf081e8955
            command: ["/bin/sh", "-c", "exec sleep infinity"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -s /host/var/lib/kata-nested/vmlinux-nested &&
                        test -s /host/var/lib/kata-nested/configuration-qemu.toml
                  periodSeconds: 60
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
    persistence:
      host:
        type: hostPath
        hostPath: /var/lib/kata-nested
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /host/var/lib/kata-nested
