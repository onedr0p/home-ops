---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kata-guest-kernel
spec:
  chartRef:
    kind: OCIRepository
    name: kata-guest-kernel
  interval: 1h
  values:
    controllers:
      kata-guest-kernel:
        type: daemonset
        initContainers:
          install:
            image:
              repository: ghcr.io/home-operations/kata-guest-kernel
              tag: 3.32.0@sha256:71ec1e834cef1ee405230b052f893544353a78d2894e1d8d3302e6bf081e8955
        containers:
          pause:
            image:
              repository: registry.k8s.io/pause
              tag: 3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
    defaultPodOptions:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
    persistence:
      host:
        type: hostPath
        hostPath: /var/lib/kata-nested
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /host/var/lib/kata-nested
