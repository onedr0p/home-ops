---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 192.168.69.0/24
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: l3-bgp-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgppeerconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: l3-bgp-peer-config
spec:
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: l3-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cilium
      localASN: 64514
      peers:
        - name: unifi
          peerASN: 64513
          peerAddress: 192.168.1.1
          peerConfigRef:
            name: l3-bgp-peer-config
---
# FRR keys peers by source address, so Cilium peers from a dedicated /32 to
# leave the node address free for the Talos speaker
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpnodeconfigoverride_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: k8s-0
spec:
  bgpInstances:
    - name: cilium
      peers:
        - name: unifi
          localAddress: 192.168.42.110
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpnodeconfigoverride_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: k8s-1
spec:
  bgpInstances:
    - name: cilium
      peers:
        - name: unifi
          localAddress: 192.168.42.111
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpnodeconfigoverride_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPNodeConfigOverride
metadata:
  name: k8s-2
spec:
  bgpInstances:
    - name: cilium
      peers:
        - name: unifi
          localAddress: 192.168.42.112
