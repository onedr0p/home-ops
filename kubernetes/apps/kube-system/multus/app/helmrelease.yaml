---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.1.1
      url: oci://ghcr.io/home-operations/charts/multus
  interval: 1h
  values:
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
