---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-operations-runner
spec:
  chartRef:
    kind: OCIRepository
    name: home-operations-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/home-operations
    githubConfigSecret: home-operations-runner-secret
    runnerScaleSetName: home-operations-onedr0p
    runnerGroup: home-operations
    minRunners: 3
    maxRunners: 3
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          runner: &name home-operations-runner
      spec:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    runner: *name
                topologyKey: kubernetes.io/hostname
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.335.1@sha256:0c6f38e8194f6c3714aa86c6dc8a72574484818ed625dd66074920b25c118508
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_ADMIN
            resources:
              limits:
                devices.kubevirt.io/kvm: 1
                devices.kubevirt.io/tun: 1
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
