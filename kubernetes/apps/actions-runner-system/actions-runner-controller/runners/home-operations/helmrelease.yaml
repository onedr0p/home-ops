---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-operations-runner
spec:
  chartRef:
    kind: OCIRepository
    name: home-operations-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/home-operations
    githubConfigSecret: home-operations-runner-secret
    runnerScaleSetName: home-operations-onedr0p
    runnerGroup: home-operations
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          runner: *name
      spec:
        runtimeClassName: kata-qemu-nested
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    runner: *name
                topologyKey: kubernetes.io/hostname
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.336.0@sha256:281a9a090522fafbf4967f158b8c97d03552b1978b688893c5f7cb1944bc5fe5
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            # The QEMU provisioner builds a CNI bridge and tc-redirect-tap per node:
            # NET_ADMIN for the bridge/tap, SYS_ADMIN for the per-node netns. Both,
            # and the devices below, apply inside the Kata VM rather than on the host
            securityContext:
              capabilities:
                add: ["NET_ADMIN", "SYS_ADMIN"]
            volumeMounts:
              - name: kvm
                mountPath: /dev/kvm
              - name: tun
                mountPath: /dev/net/tun
            # miroir's e2e alone is 12Gi of nested guests (2Gi cp + 2x5Gi workers)
            resources:
              requests:
                cpu: 4
                memory: 32Gi
              limits:
                cpu: 12
                memory: 32Gi
        volumes:
          - name: kvm
            hostPath:
              path: /dev/kvm
              type: CharDevice
          - name: tun
            hostPath:
              path: /dev/net/tun
              type: CharDevice
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
