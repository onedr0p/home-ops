---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name home-operations-runner
spec:
  chartRef:
    kind: OCIRepository
    name: home-operations-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/home-operations
    githubConfigSecret: home-operations-runner-secret
    runnerScaleSetName: home-operations-onedr0p
    runnerGroup: home-operations
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: dind
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          runner: *name
      spec:
        runtimeClassName: kata-qemu
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    runner: *name
                topologyKey: kubernetes.io/hostname
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.336.0@sha256:281a9a090522fafbf4967f158b8c97d03552b1978b688893c5f7cb1944bc5fe5
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            resources:
              requests:
                cpu: 4
                memory: 16Gi
              limits:
                cpu: 8
                memory: 16Gi
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
