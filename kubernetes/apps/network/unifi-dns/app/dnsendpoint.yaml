---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ddr-opt-out
spec:
  endpoints:
    # A CNAME hides the upstream SVCB answer, so DDR clients keep using the gateway resolver.
    - dnsName: _dns.resolver.arpa
      recordType: CNAME
      targets:
        - unifi.turbo.ac
