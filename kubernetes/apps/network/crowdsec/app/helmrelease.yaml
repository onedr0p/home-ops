---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  values:
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      acquisition:
        - namespace: network
          podName: envoy-external-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
        - name: PARSERS
          value: crowdsecurity/cri-logs
      metrics:
        serviceMonitor:
          enabled: true
