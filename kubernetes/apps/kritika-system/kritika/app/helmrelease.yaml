---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://{{ .Release.Name }}.turbo.ac
      runnerRuntimeClass: gvisor
      defaultsModelsReview: openrouter/openai/gpt-6.1-sol
      defaultsModelsFallback: openrouter/anthropic/claude-opus-5.5
      embeddingModel: openrouter/voyageai/voyage-code-4
      embeddingDims: 1024
    configFile:
      apps:
        github:
          accounts: [onedr0p]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      egress:
        allowHosts: [raw.githubusercontent.com]
      defaults:
        agent: { commands: [gh, curl, jq, yq, rg, fd] }
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.turbo.ac"
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
