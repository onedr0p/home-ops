---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    config:
      webUrl: https://{{ .Release.Name }}.turbo.ac
      runnerRuntimeClass: gvisor
      defaultsModelsReview: openrouter/openai/gpt-6.1-sol
      defaultsModelsFallback: openrouter/anthropic/claude-opus-5.5
      embeddingModel: openrouter/voyageai/voyage-code-4
      embeddingDims: 1024
    configFile:
      apps:
        github:
          accounts: [onedr0p]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      egress:
        allowHosts: [raw.githubusercontent.com]
      repositories:
        onedr0p/home-ops:
          agent: { commands: [gh, curl, jq, yq, rg, fd] }
          rules:
            - id: renovate
              whenExpr: pr.headRef.startsWith("renovate/")
              rule: >-
                This is a Renovate dependency update. Find what changed
                between the old and new versions from upstream's release
                notes, changelog or compare view, fetching them with gh when
                the body does not include them. Then check how this
                repository uses the package (its HelmRelease values,
                OCIRepository, overrides and CRDs) and report each breaking
                change, deprecation, removed or renamed value, or changed
                default that affects it. Start the summary with a verdict,
                safe to merge or not, and name the sources you read.
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      # The -tools image carries the commands agent.commands allows.
      image: ghcr.io/home-operations/kritika:0.0.2-tools
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.turbo.ac"
    monitoring:
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
