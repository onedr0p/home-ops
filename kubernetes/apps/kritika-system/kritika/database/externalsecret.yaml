---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres
spec:
  length: 32
  # No symbols: the password is interpolated into a URI and must not need
  # escaping.
  symbols: 0
  allowRepeat: true
  noUpper: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The database owner: runs kritika's migrations on the leader. CloudNativePG
# requires basic-auth for bootstrap.initdb.secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .password }}"
        uri: "postgres://kritika:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres-app
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  noUpper: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The application role: every request and job runs as it, and row-level
# security applies to it because it owns nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgres://kritika_app:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres-app
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres-runner
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  noUpper: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The runner role: runner Jobs write their own run's rows and read nothing
# else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-runner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_runner
        password: "{{ .password }}"
        uri: "postgres://kritika_runner:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres-runner
