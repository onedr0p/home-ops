---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  noUpper: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .password }}"
        uri: "postgres://kritika:{{ .password }}@kritika-postgres-rw:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
