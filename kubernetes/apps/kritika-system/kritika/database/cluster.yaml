---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kritika-postgres
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 19
  postgresql:
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/home-operations/vchord:1.5.0@sha256:97b4a1aa15b65c29fa97e84b4270cb235e7bd39e80d4a4b2e91d9fa17997566d
        dynamic_library_path:
          - /usr/lib/postgresql/19/lib/
        extension_control_path:
          - /usr/share/postgresql/19/
    shared_preload_libraries:
      - vchord
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
  storage:
    size: 10Gi
    storageClass: miroir-slow-local
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  bootstrap:
    recovery:
      source: kritika-postgres-backup
      database: kritika
      secret:
        name: kritika-postgres-credentials
  externalClusters:
    - name: kritika-postgres-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: kritika-postgres
          serverName: kritika-postgres
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kritika-postgres
