---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.12.7
      url: oci://ghcr.io/home-operations/charts/miroir
  interval: 1h
  values:
    autoEvictAfter: 1h
    drbd:
      alExtents: 6007
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    replicaCount: 2
