---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  values:
    replicaCount: 2
    # keep well above any node reboot or upgrade window
    autoEvictAfter: 2h
    drbd:
      # DRBD's default activity-log size amplifies scattered random writes
      # (kopia caches) on consumer NVMe; larger AL trades longer post-crash
      # resync for less metadata churn
      alExtents: 6007
      verify:
        schedule: "0 5 * * 1"
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
