---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus-sidecar
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      ref:
        tag: 0.5.5
      url: oci://ghcr.io/home-operations/charts/gatus-sidecar
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      env:
        TZ: America/New_York
      envFrom:
        - secretRef:
            name: "{{ .Release.Name }}-secret"
    sidecar:
      kinds:
        httproute:
          enable: true
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
      hostnames:
        - "{{ .Release.Name }}.turbo.ac"
        - status.turbo.ac
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    config:
      existingConfigMap: "{{ .Release.Name }}-configmap"
      items:
        - key: config.yaml
          path: config.yaml
        - key: buddy.yaml
          path: buddy.yaml
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 5Gi
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
