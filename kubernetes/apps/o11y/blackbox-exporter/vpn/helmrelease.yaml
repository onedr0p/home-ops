---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-vpn
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-vpn
    strategy:
      type: Recreate
      rollingUpdate: null
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: |-
        [{
          "name": "vpn",
          "namespace": "kube-system",
          "ips": ["192.168.90.13/24"],
          "mac": "3e:d0:83:c0:8e:13"
        }]
    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: VpnProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-vpn"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
