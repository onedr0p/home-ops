---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-lan
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-lan
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-lan
    config:
      modules:
        dns_https_rr:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            query_name: internal.turbo.ac
            query_type: HTTPS
            validate_answer_rrs:
              fail_if_none_matches_regexp:
                - alpn="h3,h2"
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-lan"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
