---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/home-operations/charts/kopiur
      ref:
        tag: 0.11.2
  interval: 1h
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    ui:
      enabled: true
      auth:
        anonymous:
          enabled: true
          user: &uiUser kopiur-ui-anonymous
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      rbac:
        bindings:
          - role: user
            users:
              - *uiUser
      serviceMonitor:
        enabled: true
