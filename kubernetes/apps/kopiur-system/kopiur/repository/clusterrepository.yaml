---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: expanse
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      bucket: kopiur
      endpoint: expanse.internal:9000
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  execution:
    mode: Central
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Kopia defaults each budget to 5000 MiB, more than a whole 5Gi cache PVC, so the
      # sweeper never runs and the cache fills the volume. Kopia also caps the
      # index-blobs cache at the metadata budget, so that budget counts twice.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    podLabels:
      app.kubernetes.io/name: kopiur-mover
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: America/New_York
