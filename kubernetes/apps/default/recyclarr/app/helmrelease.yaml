---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/recyclarr/charts/recyclarr
      ref:
        tag: 9.0.0
  interval: 1h
  values:
    apiKey:
      existingSecret: recyclarr-api-key-secret
    configs:
      existingConfigMap: recyclarr-configmap
    envFrom:
      - secretRef:
          name: recyclarr-secret
    deploymentAnnotations:
      secret.reloader.stakater.com/auto: "true"
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
