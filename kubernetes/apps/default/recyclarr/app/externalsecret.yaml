---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: recyclarr
spec:
  length: 64
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - RECYCLARR_API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: recyclarr
spec:
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    generatorRef:
      kind: Password
      name: recyclarr
  data:
    - match:
        secretKey: &key RECYCLARR_API_KEY
        remoteRef:
          remoteKey: recyclarr
          property: *key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: recyclarr-secret
    template:
      data:
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        RECYCLARR_API_KEY: "{{ .RECYCLARR_API_KEY }}"
        SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: recyclarr
    - extract:
        key: sonarr
