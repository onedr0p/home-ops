---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-mcp
  interval: 1h
  values:
    controllers:
      unifi-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.45.1@sha256:17e8d34e871d1869b43663922e172a91904154a1f3d27e99fd681321eb17ddd9
            env:
              TZ: America/New_York
              UNIFI_HOST: unifi.internal
              UNIFI_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,unifi-mcp.turbo.ac
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            # TCP probes: HTTP probes get a 401 without the bearer token and a 421 for the kubelet Host header
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.turbo.ac"
        parentRefs:
          - name: envoy-internal
            namespace: network
