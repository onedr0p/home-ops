---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-secret
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        MEMINI_EMBED_API_KEY: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: openrouter
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-api-keys
    template:
      data:
        api-keys.yaml: |-
          keys:
            - name: personal
              secret: "{{ .MEMINI_PERSONAL_API_KEY }}"
              home: personal/devin
            - name: work
              secret: "{{ .MEMINI_WORK_API_KEY }}"
              home: work/devin
  dataFrom:
    - extract:
        key: memini
