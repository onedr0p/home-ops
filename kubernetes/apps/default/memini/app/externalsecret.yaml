---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-secret
    template:
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        MEMINI_EMBED_API_KEY: "{{ .MEMINI_OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-api-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-api-keys
    template:
      data:
        api-keys.yaml: |-
          keys:
            - name: personal-claude
              secret: "{{ .MEMINI_PERSONAL_CLAUDE_API_KEY }}"
              home: personal/devin
            - name: personal-codex
              secret: "{{ .MEMINI_PERSONAL_CODEX_API_KEY }}"
              home: personal/devin
            - name: work-claude
              secret: "{{ .MEMINI_WORK_CLAUDE_API_KEY }}"
              home: work/devin
            - name: work-codex
              secret: "{{ .MEMINI_WORK_CODEX_API_KEY }}"
              home: work/devin
  dataFrom:
    - extract:
        key: memini
